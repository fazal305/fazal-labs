<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suite | Fazal Labs</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://code.jquery.com" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <link href="css/suite.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-root"></div>

      <main class="main-content">
        <div class="page-container">
          <section id="suiteDetail"></section>

          <section class="section">
            <div class="section-header">
              <div>
                <h2 class="section-title">Products Inside This Suite</h2>
                <p class="section-note">
                  Generated from shared product configuration.
                </p>
              </div>
            </div>
            <div id="suiteProducts" class="grid suite-products"></div>
          </section>

          <section class="section grid grid-2">
            <div>
              <div class="section-header">
                <div>
                  <h2 class="section-title">Suite Roadmap</h2>
                  <p class="section-note">Work connected to this suite.</p>
                </div>
              </div>
              <div id="suiteRoadmap" class="timeline-list"></div>
            </div>

            <div>
              <div class="section-header">
                <div>
                  <h2 class="section-title">Suite Changelog</h2>
                  <p class="section-note">Updates connected to this suite.</p>
                </div>
              </div>
              <div id="suiteChangelog" class="timeline-list"></div>
            </div>
          </section>

          <section class="section grid grid-2">
            <div>
              <div class="section-header">
                <div>
                  <h2 class="section-title">Future Additions</h2>
                  <p class="section-note">
                    Possible next modules for this suite.
                  </p>
                </div>
              </div>
              <ul id="suiteFutureAdditions" class="future-list"></ul>
            </div>

            <div>
              <div class="section-header">
                <div>
                  <h2 class="section-title">Related Suites</h2>
                  <p class="section-note">
                    Other parts of the Fazal Labs system.
                  </p>
                </div>
              </div>
              <div id="relatedSuites" class="related-list"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/suite.js"></script>
  </body>
</html>
