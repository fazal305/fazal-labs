<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product | Fazal Labs</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://code.jquery.com" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <link href="css/product.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-root"></div>

      <main class="main-content">
        <div class="page-container">
          <section id="productHero"></section>

          <section class="section product-layout">
            <div>
              <section class="doc-section">
                <h2 class="section-title">Key Features</h2>
                <ul id="productFeatures" class="feature-list mt-3"></ul>
              </section>

              <section class="doc-section">
                <h2 class="section-title">Architecture Notes</h2>
                <ul
                  id="productArchitecture"
                  class="architecture-list mt-3"
                ></ul>
              </section>

              <section class="doc-section">
                <h2 class="section-title">Documentation</h2>
                <p id="productDocumentation" class="card-text mt-3"></p>
              </section>

              <section class="doc-section">
                <h2 class="section-title">Future Additions</h2>
                <ul id="productFutureAdditions" class="feature-list mt-3"></ul>
              </section>

              <section class="doc-section">
                <div class="section-header">
                  <div>
                    <h2 class="section-title">Product Roadmap</h2>
                    <p class="section-note">
                      Roadmap items connected to this product.
                    </p>
                  </div>
                </div>
                <div id="productRoadmap" class="timeline-list"></div>
              </section>

              <section class="doc-section">
                <div class="section-header">
                  <div>
                    <h2 class="section-title">Product Changelog</h2>
                    <p class="section-note">
                      Changelog entries connected to this product.
                    </p>
                  </div>
                </div>
                <div id="productChangelog" class="timeline-list"></div>
              </section>
            </div>

            <aside class="product-side-panel">
              <section class="link-panel">
                <h2 class="section-title">Links</h2>
                <div id="productLinks" class="actions-row mt-3"></div>
              </section>

              <section class="link-panel">
                <h2 class="section-title">Tech Stack</h2>
                <div id="productTechStack" class="card-meta mt-3"></div>
              </section>

              <section class="link-panel">
                <h2 class="section-title">Related Products</h2>
                <div id="relatedProducts" class="related-products mt-3"></div>
              </section>
            </aside>
          </section>
        </div>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/product.js"></script>
  </body>
</html>
