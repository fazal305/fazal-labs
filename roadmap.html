<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roadmap | Fazal Labs</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://code.jquery.com" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <link href="css/roadmap.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-root"></div>

      <main class="main-content">
        <div class="page-container">
          <header class="page-header">
            <div>
              <p class="eyebrow">Planning System</p>
              <h1 class="page-title">Roadmap</h1>
              <p class="page-description">
                Create, edit, delete, filter, and persist ecosystem roadmap
                items.
              </p>
            </div>
            <button class="btn-lab" type="button" onclick="openRoadmapModal()">
              Add Roadmap Item
            </button>
          </header>

          <section class="roadmap-toolbar">
            <div id="roadmapFilters" class="filter-bar"></div>
          </section>

          <section id="roadmapBoard" class="roadmap-board"></section>
        </div>
      </main>
    </div>

    <div
      class="modal fade"
      id="roadmapModal"
      tabindex="-1"
      aria-labelledby="roadmapModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <form id="roadmapForm" class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="roadmapModalLabel">
              Roadmap Item
            </h2>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="roadmapId" />

            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label" for="roadmapTitle">Title</label>
                <input id="roadmapTitle" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label class="form-label" for="roadmapPriority">Priority</label>
                <select id="roadmapPriority" class="form-select">
                  <option>High</option>
                  <option>Medium</option>
                  <option>Low</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="roadmapSuite">Suite</label>
                <select id="roadmapSuite" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="roadmapProduct">Product</label>
                <select
                  id="roadmapProduct"
                  class="form-select"
                  required
                ></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="roadmapStatus">Status</label>
                <select id="roadmapStatus" class="form-select">
                  <option>Planned</option>
                  <option>In Progress</option>
                  <option>Completed</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label" for="roadmapDescription"
                  >Description</label
                >
                <textarea
                  id="roadmapDescription"
                  class="form-control"
                  rows="4"
                  required
                ></textarea>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-ghost" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn-lab">Save Item</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/roadmap.js"></script>
  </body>
</html>
