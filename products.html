<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products | Fazal Labs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://code.jquery.com" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <link href="css/products.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-root"></div>

      <main class="main-content">
        <div class="page-container">
          <header class="page-header">
            <div>
              <p class="eyebrow">Product Universe</p>
              <h1 class="page-title">Products</h1>
              <p class="page-description">
                Search, filter, and open every repository in the Fazal Labs
                ecosystem.
              </p>
            </div>
            <a class="btn-lab" href="roadmap.html" data-transition-link
              >Plan Roadmap</a
            >
          </header>

          <section class="products-toolbar">
            <div class="products-summary">
              <span
                ><strong class="result-count" id="resultCount">0</strong>
                products found</span
              >
              <span id="activeFilterSummary"
                >All suites, statuses, and technologies</span
              >
            </div>
            <div id="productFilters" class="filter-bar"></div>
          </section>

          <section id="productsGrid" class="grid products-grid"></section>
        </div>
      </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/products.js"></script>
  </body>
</html>
