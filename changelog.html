<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Changelog | Fazal Labs</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://code.jquery.com" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
    <link href="css/changelog.css" rel="stylesheet" />
  </head>
  <body>
    <div class="app-shell">
      <div id="sidebar-root"></div>

      <main class="main-content">
        <div class="page-container">
          <header class="page-header">
            <div>
              <p class="eyebrow">Release History</p>
              <h1 class="page-title">Changelog</h1>
              <p class="page-description">
                Track features, fixes, refactors, documentation updates, and
                release notes across the ecosystem.
              </p>
            </div>
            <button
              class="btn-lab"
              type="button"
              onclick="openChangelogModal()"
            >
              Add Entry
            </button>
          </header>

          <section class="changelog-toolbar">
            <div id="changelogFilters" class="filter-bar"></div>
          </section>

          <section class="changelog-layout">
            <aside class="changelog-sidebar">
              <h2 class="section-title">Types</h2>
              <div id="typeSummary" class="timeline-list mt-3"></div>
            </aside>

            <div id="changelogFeed" class="changelog-feed"></div>
          </section>
        </div>
      </main>
    </div>

    <div
      class="modal fade"
      id="changelogModal"
      tabindex="-1"
      aria-labelledby="changelogModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <form id="changelogForm" class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="changelogModalLabel">
              Changelog Entry
            </h2>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="changeId" />

            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label" for="changeTitle">Title</label>
                <input id="changeTitle" class="form-control" required />
              </div>
              <div class="col-md-4">
                <label class="form-label" for="changeType">Type</label>
                <select id="changeType" class="form-select">
                  <option>Feature</option>
                  <option>Fix</option>
                  <option>Refactor</option>
                  <option>Documentation</option>
                  <option>Release</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="changeSuite">Suite</label>
                <select id="changeSuite" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="changeProduct">Product</label>
                <select
                  id="changeProduct"
                  class="form-select"
                  required
                ></select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="changeDate">Date</label>
                <input
                  id="changeDate"
                  class="form-control"
                  type="date"
                  required
                />
              </div>
              <div class="col-12">
                <label class="form-label" for="changeDescription"
                  >Description</label
                >
                <textarea
                  id="changeDescription"
                  class="form-control"
                  rows="4"
                  required
                ></textarea>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn-ghost" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn-lab">Save Entry</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/changelog.js"></script>
  </body>
</html>
